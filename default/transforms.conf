## -----------------------------------------------------------
## ----------------------- INDEX TIME  -----------------------
## -----------------------------------------------------------
## -- TRANSFORMS (index time)
# ------------------------------------------------------------
# Manifest-Drop (zuerst)
# ------------------------------------------------------------
[focus_azure_drop_manifest]
SOURCE_KEY = MetaData:Source
REGEX = (?i)manifest\.json$
DEST_KEY = queue
FORMAT = nullQueue

# ------------------------------------------------------------
# Header erkennen
# ------------------------------------------------------------
[focus_azure_drop_header]
REGEX = ^BilledCost,BillingAccountId,.+
DEST_KEY = queue
FORMAT = nullQueue

# ------------------------------------------------------------
# CSV Versionserkennung über Spaltenanzahl
# ------------------------------------------------------------

# v1.2 (108 Spalten) 
[focus_azure_v_1_2_length]
REGEX = ^(?:(?:\xEF\xBB\xBF)?(?:"(?:[^"]|"")*"|[^",]*),){104,110}(?:"(?:[^"]|"")*"|[^",]*)$
DEST_KEY = MetaData:Sourcetype
FORMAT = sourcetype::azure:focus:csv:v12

# v1.0 (96 Spalten)
[focus_azure_v_1_0_length]
REGEX = ^(?:(?:\xEF\xBB\xBF)?(?:"(?:[^"]|"")*"|[^",]*),){90,100}(?:"(?:[^"]|"")*"|[^",]*)$
DEST_KEY = MetaData:Sourcetype
FORMAT = sourcetype::azure:focus:csv:v10r2

