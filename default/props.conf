[focus:json]
## For HEC events
## -----------------------------------------------------------
## ----------------------- INDEX TIME  -----------------------
## -----------------------------------------------------------
## -- GREAT 8
INDEXED_EXTRACTIONS = JSON
SHOULD_LINEMERGE = false
TIMESTAMP_FIELDS = ChargePeriodStart
TIME_FORMAT = %Y-%m-%dT%H:%M:%S
KV_MODE = none
NO_BINARY_CHECK = true
TRUNCATE = 0
## -- TRANSFORMS (transforms.conf)

## -----------------------------------------------------------
## ----------------------- SEARCH TIME -----------------------
## -----------------------------------------------------------
## -- REPORT (transforms.conf)
## -- EXTRACT (_raw)
EXTRACT-Tags = Tags\W+(?<Tags>\{[^}]+\})
## -- FIELDALIAS 
## -- EVAL
## -- LOOKUP


[azure:focus:csv]
## -----------------------------------------------------------
## ----------------------- INDEX TIME  -----------------------
## -----------------------------------------------------------
INDEXED_EXTRACTIONS = CSV
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 0
TIME_PREFIX = ^(?:.*?[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z,){3}
# TIME_PREFIX -> ChargePeriodStart (4.Zeitwert)
MAX_TIMESTAMP_LOOKAHEAD = 25
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
TZ = UTC
## -- TRANSFORMS (transforms.conf)
TRANSFORMS-drop = focus_azure_drop_manifest, focus_azure_drop_header
TRANSFORMS-version_check = focus_azure_v_1_2_length, focus_azure_v_1_0_length


# v1.0 Parsing (FOCUS 1.0r2)
[azure:focus:csv:v10r2]
## -----------------------------------------------------------
## ----------------------- SEARCH TIME -----------------------
## -----------------------------------------------------------
## -- REPORT (transforms.conf)
REPORT-focus_azure_fields = focus_azure_fields_v_1_0
# Felder aus AZURE Focus Spez. 1.02r
REPORT-focus_azure_source_path_attrs = focus_azure_source_path_attrs
# Azure Source Attributes for Audit
## -- EXTRACT (_raw)
## -- FIELDALIAS 
## -- EVAL 
EVAL-Tags = case(match(Tags,"^\\s*\\{\"\""), replace(Tags,"\"\"","\""), match(Tags,"^\\s*\\{'.*'\\}\\s*$"), replace(Tags,"'","\""), true(), Tags)
# 1.CSV-escaped -> ent-escapen | 2.selten: Single quotes -> double | 3.sonst: unverändert
EVAL-BillingAccountId = mvindex(split(BillingAccountId,"/"), -1)
EVAL-ResourceId = mvindex(split(ResourceId,"/"), -1)
EVAL-SubAccountId = mvindex(split(SubAccountId,"/"), -1)
EVAL-focus_version = "1.0r2"
## -- LOOKUP

