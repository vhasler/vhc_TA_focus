# -------------------------------------------- general 

# INDEX declaration
[focus_index]
definition = index=finops OR index=focus OR index=focus_sample
iseval = 0

# -------------------------------------------- base 

# Values for tstats (FOCUS Specification v1.2)
[focus_tstats_values]
definition = \
    values(cost.AccountId) as AccountId \
    values(cost.AccountName) as AccountName \
    values(cost.AvailabilityZone) as AvailabilityZone \
    values(cost.BilledCost) as BilledCost \
    values(cost.BillingAccountId) as BillingAccountId \
    values(cost.BillingAccountName) as BillingAccountName \
    values(cost.BillingAccountType) as BillingAccountType \
    values(cost.BillingCurrency) as BillingCurrency \
    values(cost.BillingPeriodStart) as BillingPeriodStart \
    values(cost.BillingPeriodEnd) as BillingPeriodEnd \
    values(cost.CapacityReservationId) as CapacityReservationId \
    values(cost.CapacityReservationStatus) as CapacityReservationStatus \
    values(cost.ChargeCategory) as ChargeCategory \
    values(cost.ChargeClass) as ChargeClass \
    values(cost.ChargeDescription) as ChargeDescription \
    values(cost.ChargeFrequency) as ChargeFrequency \
    values(cost.ChargeOrigination) as ChargeOrigination \
    values(cost.ChargePeriodStart) as ChargePeriodStart \
    values(cost.ChargePeriodEnd) as ChargePeriodEnd \
    values(cost.CommitmentDiscountCategory) as CommitmentDiscountCategory \
    values(cost.CommitmentDiscountId) as CommitmentDiscountId \
    values(cost.CommitmentDiscountName) as CommitmentDiscountName \
    values(cost.CommitmentDiscountQuantity) as CommitmentDiscountQuantity \
    values(cost.CommitmentDiscountStatus) as CommitmentDiscountStatus \
    values(cost.CommitmentDiscountType) as CommitmentDiscountType \
    values(cost.CommitmentDiscountUnit) as CommitmentDiscountUnit \
    values(cost.ConsumedQuantity) as ConsumedQuantity \
    values(cost.ConsumedUnit) as ConsumedUnit \
    values(cost.ContractedCost) as ContractedCost \
    values(cost.ContractedUnitPrice) as ContractedUnitPrice \
    values(cost.EffectiveCost) as EffectiveCost \
    values(cost.InvoiceId) as InvoiceId \
    values(cost.InvoiceIssuer) as InvoiceIssuer \
    values(cost.ListCost) as ListCost \
    values(cost.ListUnitPrice) as ListUnitPrice \
    values(cost.PricingCategory) as PricingCategory \
    values(cost.PricingCurrency) as PricingCurrency \
    values(cost.PricingCurrencyContractedUnitPrice) as PricingCurrencyContractedUnitPrice \
    values(cost.PricingCurrencyEffectiveCost) as PricingCurrencyEffectiveCost \
    values(cost.PricingCurrencyListUnitPrice) as PricingCurrencyListUnitPrice \
    values(cost.PricingQuantity) as PricingQuantity \
    values(cost.PricingUnit) as PricingUnit \
    values(cost.ProviderName) as ProviderName \
    values(cost.PublisherName) as PublisherName \
    values(cost.RegionId) as RegionId \
    values(cost.RegionName) as RegionName \
    values(cost.ResourceId) as ResourceId \
    values(cost.ResourceName) as ResourceName \
    values(cost.ResourceType) as ResourceType \
    values(cost.ServiceCategory) as ServiceCategory \
    values(cost.ServiceName) as ServiceName \
    values(cost.ServiceSubcategory) as ServiceSubcategory \
    values(cost.SkuId) as SkuId \
    values(cost.SkuMeter) as SkuMeter \
    values(cost.SkuPriceDetails) as SkuPriceDetails \
    values(cost.SkuPriceId) as SkuPriceId \
    values(cost.SubAccountId) as SubAccountId \
    values(cost.SubAccountName) as SubAccountName \
    values(cost.SubAccountType) as SubAccountType \
    values(cost.Tags) as Tags \
    values(cost.RunIngestTime) as RunIngestTime \
    values(cost.RunRawData) as RunRawData \
    values(cost.RunTags) as RunTags
iseval = 0

# SUMs for tstats
[focus_tstats_sum]
definition = \
    sum(cost.BilledCost) as sumBilledCost \
    sum(cost.EffectiveCost) as sumEffectiveCost \
    sum(cost.ConsumedQuantity) as sumConsumedQuantity
iseval = 0

# FROM for tstats
[focus_tstats_from]
definition = \
    from datamodel=focus.cost where \
    cost.RunIngestTime IN (`focus_latest_run_ingest`)
iseval = 0

# BY for tstats
[focus_tstats_by]
definition = \
    by _time cost.RunRawData
iseval = 0

# SEARCH for filter or without filter
[focus_search]
definition = tstats \
    `focus_tstats_values` \
    `focus_tstats_sum` \
    `focus_tstats_from`
iseval = 0

[focus_base_search]
definition = tstats \
    `focus_tstats_values` \
    `focus_tstats_sum` \
    `focus_tstats_from` \
    `focus_tstats_by`
iseval = 0

# -------------------------------------------- helper

# latest run ingest - used in focus_tstats_from
[focus_latest_run_ingest]
definition = [| tstats max(cost.RunIngestTime) as latest_ingest \
        from datamodel=focus.cost by _time cost.ProviderName span=1mon \
    | stats values(latest_ingest) as list \
    | eval latest_ingest = mvjoin(list, ", ") \
    | eval search=latest_ingest]
iseval = 0

# time readable format - free to use after 
[focus_time_readable]
definition = \
| foreach BillingPeriodStart BillingPeriodEnd ChargePeriodStart ChargePeriodEnd \
    [ eval <<FIELD>> = coalesce( \
          strptime(<<FIELD>>, "%Y-%m-%dT%H:%M:%SZ"), \
          strptime(replace(<<FIELD>>, "([+-]\\d{2}):(\\d{2})$", "\\1\\2"), "%Y-%m-%dT%H:%M:%S%z"), \
          strptime(<<FIELD>>, "%Y-%m-%d %H:%M:%S") \
        ), \
      <<FIELD>> = strftime(<<FIELD>>, "%Y-%m-%d %H:%M:%S") \
    ]
iseval = 0


# tag coverage
[focus_tag]
definition = \
| eval with_tag = if(RunTags == "n/a",null(),1) \
| eval no_tag = if(RunTags == "n/a",1,null())
iseval = 0

[focus_tag_timetable]
definition = \
| stats max(with_tag) as with_tag  min(no_tag) as no_tag by _time ResourceId \
| timechart span=1d dc(ResourceId) as ResourceId sum(with_tag) as with_tag sum(no_tag) as no_tag \
| where ResourceId > 0 \
| eval total = ResourceId \
| eval tag_perc = round(100*with_tag/total,2) \
| table _time total with_tag no_tag tag_perc
iseval = 0

# tag filters
[focus_tag_keys]
definition = \
| eval key = if(isnull(Tags) OR match(Tags,"^\\s*$"), "n/a", null()) \
| rex field=Tags max_match=0 "(['\"])(?<key>[^'\"]+)\1:\s*\1(?<value>[^'\"]+)\1" \
| stats values(key) as key \
| mvexpand key \
| eval key_values = "*".key."*" \
| table key key_values
iseval = 0

[focus_tag_values]
definition = \
| eval value = if(isnull(Tags) OR match(Tags,"^\\s*$"), "n/a", null()) \
| rex field=Tags max_match=0 "(['\"])(?<key>[^'\"]+)\1:\s*\1(?<value>[^'\"]+)\1" \
| stats values(value) as value \
| mvexpand value \
| eval value_values = "*".value."*" \
| table value value_values 
iseval = 0

